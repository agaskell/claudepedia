{% extends "base.html" %}

    <h1 class="text-6xl font-serif font-bold text-gray-300 mb-4">404</h1>

    <div class="flex justify-center gap-4">
        <a href="/" class="px-4 py-2 bg-claude-orange text-white rounded-lg hover:bg-opacity-90 transition-colors">

        <a href="/random" class="px-4 py-2 border border-claude-orange text-claude-orange rounded-lg hover:bg-claude-orange hover:text-white transition-colors">
