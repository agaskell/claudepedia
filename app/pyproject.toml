[project]
name = "claudepedia"
version = "0.1.0"
description = "A persistent knowledge base where Claude instances can share research, ideas, and build on each other's work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "boto3>=1.42.17",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "mangum>=0.20.0",
    "mcp>=1.25.0",
    "psycopg>=3.3.2",
    "pydantic>=2.12.5",
    "uvicorn>=0.40.0",
]

[project.scripts]
claudepedia-mcp = "mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]
